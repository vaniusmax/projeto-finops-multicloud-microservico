# Uso:
#   make up              → sobe infra (Traefik, PostgreSQL, pgAdmin, Portainer)
#   make migrate         → executa alembic upgrade head
#   make backend-up      → sobe API
#   make frontend-up     → sobe frontend
#   make app-up          → sobe API + frontend
#
# Profiles: infra | migrate | backend | frontend | app | init

services:

  # ── Infraestrutura ─────────────────────────────────────────────────────────

  traefik:
    profiles: ["infra"]
    image: traefik:v3.6.1
    container_name: traefik
    restart: unless-stopped
    environment:
      DOCKER_API_VERSION: "1.54"
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      - --api.dashboard=true
      - --log.level=INFO
      - --accesslog=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    networks:
      - proxy
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256M }
        reservations: { cpus: "0.10", memory: 64M }
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik.rule=Host(`${TRAEFIK_DASHBOARD_HOST:-traefik.local-dev}`)
      - traefik.http.routers.traefik.entrypoints=${TRAEFIK_ENTRYPOINTS:-web}
      - traefik.http.routers.traefik.priority=120
      - traefik.http.routers.traefik.service=api@internal

  finops-db:
    profiles: ["infra"]
    image: postgres:16.9
    container_name: finops-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: finops
      POSTGRES_USER: finops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finops123}
      TZ: America/Recife
    volumes:
      - finops_pgdata:/var/lib/postgresql/data
    networks:
      - internal
    deploy:
      resources:
        limits: { cpus: "2.00", memory: 2G }
        reservations: { cpus: "0.25", memory: 512M }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finops -d finops"]
      interval: 10s
      timeout: 5s
      retries: 10

  finops-db-init:
    profiles: ["init"]
    image: postgres:16.9
    container_name: finops-db-init
    restart: "no"
    depends_on:
      finops-db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-finops123}
      TZ: America/Recife
    volumes:
      - ./scripts:/sql:ro
    command:
      ["bash", "-lc", "psql -h finops-db -U finops -d finops -v ON_ERROR_STOP=1 -f /sql/001_finops_canonical_v0.sql"]
    networks:
      - internal

  pgadmin:
    profiles: ["infra"]
    image: dpage/pgadmin4:9.13
    container_name: finops-pgadmin
    restart: unless-stopped
    user: "5050:5050"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@localhost.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_LISTEN_PORT: 80
      TZ: America/Recife
    depends_on:
      finops-db:
        condition: service_healthy
    volumes:
      - finops_pgadmin:/var/lib/pgadmin
    networks:
      - proxy
      - internal
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 512M }
        reservations: { cpus: "0.05", memory: 128M }
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.pgadmin.rule=Host(`${PGADMIN_HOST:-pgadmin.local-dev}`)
      - traefik.http.routers.pgadmin.entrypoints=${TRAEFIK_ENTRYPOINTS:-web}
      - traefik.http.routers.pgadmin.priority=110
      - traefik.http.services.pgadmin.loadbalancer.server.port=80

  portainer:
    profiles: ["infra"]
    image: portainer/portainer-ce:2.27.3
    container_name: portainer
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data
    networks:
      - proxy
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 256M }
        reservations: { cpus: "0.05", memory: 64M }
    labels:
      - traefik.enable=true
      - traefik.http.routers.portainer.rule=Host(`${PORTAINER_HOST:-portainer.local-dev}`)
      - traefik.http.routers.portainer.entrypoints=${TRAEFIK_ENTRYPOINTS:-web}
      - traefik.http.routers.portainer.priority=110
      - traefik.http.services.portainer.loadbalancer.server.port=9000

  # ── Migrations ─────────────────────────────────────────────────────────────

  finops-api-migrate:
    profiles: ["migrate"]
    image: ${BACKEND_IMAGE:-vaniusoliveira/finops-backend:latest}
    build:
      context: ../finops-micro/backend
      dockerfile: Dockerfile.prod
    container_name: finops-api-migrate
    restart: "no"
    user: "1000:1000"
    env_file: .env.backend
    command: ["alembic", "upgrade", "head"]
    networks:
      - internal
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 512M }

  # ── Backend ────────────────────────────────────────────────────────────────

  finops-api:
    profiles: ["backend", "app"]
    image: ${BACKEND_IMAGE:-vaniusoliveira/finops-backend:latest}
    build:
      context: ../finops-micro/backend
      dockerfile: Dockerfile.prod
    container_name: finops-api
    restart: unless-stopped
    user: "1000:1000"
    env_file: .env.backend
    volumes:
      - ${AWS_HOST_CREDENTIALS_DIR:-/home/ubuntu/.aws}:/home/ubuntu/.aws:ro
      - ${AZURE_HOST_CREDENTIALS_DIR:-/home/ubuntu/.azure}:/home/ubuntu/.azure
      - ${OCI_HOST_CREDENTIALS_DIR:-/home/ubuntu/.oci}:${OCI_CONTAINER_CREDENTIALS_DIR:-/home/ubuntu/.oci}:ro
    expose:
      - "8000"
    networks:
      - internal
      - proxy
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 1G }
        reservations: { cpus: "0.25", memory: 256M }
    healthcheck:
      test:
        ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')\""]
      interval: 20s
      timeout: 5s
      retries: 5
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.finops-api.rule=Host(`${FINOPS_API_HOST:-finops.local-dev}`) && (PathPrefix(`/api`) || PathPrefix(`/docs`) || PathPrefix(`/redoc`) || Path(`/openapi.json`))
      - traefik.http.routers.finops-api.entrypoints=${TRAEFIK_ENTRYPOINTS:-web}
      - traefik.http.routers.finops-api.priority=100
      - traefik.http.services.finops-api.loadbalancer.server.port=8000

  # ── Frontend ───────────────────────────────────────────────────────────────

  finops-web:
    profiles: ["frontend", "app"]
    image: ${FRONTEND_IMAGE:-vaniusoliveira/finops-frontend:latest}
    build:
      context: ../finops-micro/frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_GATEWAY_URL: ${NEXT_PUBLIC_API_GATEWAY_URL:-http://finops.local-dev}
        NEXT_PUBLIC_API_BASE_PATH: ${NEXT_PUBLIC_API_BASE_PATH:-/api/v1}
        NEXT_PUBLIC_USE_MOCKS: ${NEXT_PUBLIC_USE_MOCKS:-false}
    container_name: finops-web
    restart: unless-stopped
    env_file: .env.frontend
    expose:
      - "3000"
    networks:
      - proxy
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256M }
        reservations: { cpus: "0.10", memory: 64M }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.finops-web.rule=Host(`${FINOPS_WEB_HOST:-finops.local-dev}`)
      - traefik.http.routers.finops-web.entrypoints=${TRAEFIK_ENTRYPOINTS:-web}
      - traefik.http.routers.finops-web.priority=1
      - traefik.http.services.finops-web.loadbalancer.server.port=3000

volumes:
  finops_pgdata:
  finops_pgadmin:
  portainer_data:

networks:
  proxy:
    name: proxy
  internal:
    name: internal
