services:
  finops-api:
    image: ${BACKEND_IMAGE:-vaniusoliveira/finops-backend:latest}
    build:
      context: ../finops-micro/backend
      dockerfile: Dockerfile.prod
    container_name: finops-api
    restart: unless-stopped
    user: "1000:1000"
    environment:
      HOME: ${HOME_DIR:-/home/ubuntu}
      TZ: ${TZ:-America/Sao_Paulo}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://finops:finops123@finops-db:5432/finops}
      APP_ENV: ${APP_ENV:-prod}
      DEBUG: ${FINOPS_DEBUG:-false}
      API_PREFIX: ${API_PREFIX:-/api/v1}
      AUTO_INGEST_ON_REQUEST: ${AUTO_INGEST_ON_REQUEST:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://finops.local}
      CORS_ORIGIN_REGEX: "${CORS_ORIGIN_REGEX:-^https?://finops\\.local$}"
      AUTH_FRONTEND_BASE_URL: ${AUTH_FRONTEND_BASE_URL:-http://finops.local}
      AUTH_ALLOWED_EMAIL_DOMAINS: ${AUTH_ALLOWED_EMAIL_DOMAINS:-algar.com.br,algartelecom.com.br}
      AUTH_VERIFY_EMAIL_PATH: ${AUTH_VERIFY_EMAIL_PATH:-/verify-email}
      AUTH_SESSION_TTL_HOURS: ${AUTH_SESSION_TTL_HOURS:-12}
      AUTH_VERIFICATION_TTL_HOURS: ${AUTH_VERIFICATION_TTL_HOURS:-24}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-finops@algar.com.br}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-}
      AWS_PROFILE: ${AWS_PROFILE:-}
      AWS_TENANTS: ${AWS_TENANTS:-}
      AWS_CLI_PATH: ${AWS_CLI_PATH:-aws}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_SHARED_CREDENTIALS_FILE: ${AWS_SHARED_CREDENTIALS_FILE:-/home/ubuntu/.aws/credentials}
      AWS_CONFIG_FILE: ${AWS_CONFIG_FILE:-/home/ubuntu/.aws/config}
      AZURE_MANAGEMENT_GROUP_ID: ${AZURE_MANAGEMENT_GROUP_ID:-}
      AZURE_TENANTS: ${AZURE_TENANTS:-}
      AZURE_API_VERSION: ${AZURE_API_VERSION:-2023-11-01}
      AZURE_CLI_PATH: ${AZURE_CLI_PATH:-az}
      AZURE_CONFIG_DIR: ${AZURE_CONFIG_DIR:-/home/ubuntu/.azure}
      OCI_TENANT_ID: ${OCI_TENANT_ID:-}
      OCI_PROFILE: ${OCI_PROFILE:-DEFAULT}
      OCI_TENANTS: ${OCI_TENANTS:-}
      OCI_REGION: ${OCI_REGION:-sa-saopaulo-1}
      OCI_CLI_PATH: ${OCI_CLI_PATH:-oci}
      OCI_COMPARTMENT_DEPTH: ${OCI_COMPARTMENT_DEPTH:-6}
      OCI_CLI_CONFIG_FILE: ${OCI_CLI_CONFIG_FILE:-/home/ubuntu/.oci/config}
      TENANT_CONFIGS_JSON: "${TENANT_CONFIGS_JSON:-{}}"
      TARGET_MONTHLY_BRL: ${TARGET_MONTHLY_BRL:-0}
      TARGET_WEEKLY_BRL: ${TARGET_WEEKLY_BRL:-0}
      TARGET_MONTHLY_USD: ${TARGET_MONTHLY_USD:-0}
      TARGET_WEEKLY_USD: ${TARGET_WEEKLY_USD:-0}
      MONTHLY_TARGETS_JSON: ${MONTHLY_TARGETS_JSON:-}
      CURRENCY_RATE_SYNC_ON_REQUEST: ${CURRENCY_RATE_SYNC_ON_REQUEST:-true}
      CURRENCY_RATE_PROVIDER_URL: ${CURRENCY_RATE_PROVIDER_URL:-https://economia.awesomeapi.com.br/json/daily/USD-BRL/1}
      CURRENCY_RATE_TIMEOUT_SECONDS: ${CURRENCY_RATE_TIMEOUT_SECONDS:-10}
      CURRENCY_RATE_AGNO_ENABLED: ${CURRENCY_RATE_AGNO_ENABLED:-false}
      CURRENCY_RATE_YFINANCE_ENABLED: ${CURRENCY_RATE_YFINANCE_ENABLED:-true}
      CURRENCY_RATE_YFINANCE_SYMBOL: ${CURRENCY_RATE_YFINANCE_SYMBOL:-BRL=X}
    volumes:
      - /home/ubuntu/.aws:/home/ubuntu/.aws:ro
      - /home/ubuntu/.azure:/home/ubuntu/.azure
      - /home/ubuntu/.oci:/home/ubuntu/.oci:ro
    expose:
      - "8000"
    networks:
      - internal
      - proxy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')\"",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.finops-api.rule=Host(`${FINOPS_API_HOST:-finops.local}`) && PathPrefix(`/api`)
      - traefik.http.routers.finops-api.entrypoints=${TRAEFIK_ENTRYPOINTS:-web}
      - traefik.http.routers.finops-api.priority=100
      - traefik.http.services.finops-api.loadbalancer.server.port=8000

networks:
  proxy:
    external: true
    name: proxy
  internal:
    external: true
    name: internal
